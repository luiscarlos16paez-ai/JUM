<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Master Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" onclick="toggleTheme()">🌓</button>

    <div id="landing-page" class="app-container" style="text-align:center; padding-top: 80px;">
        <h1 class="titulo-principal">Contador de SKU</h1>
        <div class="logo-carrito">🛒</div>
        <p class="subtitulo">Gestión profesional de inventario.</p>
        <button onclick="mostrarLogin()" class="btn-inicio">Comenzar Ahora</button>
    </div>

    <div id="auth-section" class="app-container" style="display:none; padding-top: 60px;">
        <div class="input-card modern-card">
            <h2 style="text-align:center; margin-bottom:25px;">Acceso</h2>
            <input type="email" id="email" placeholder="Correo electrónico" class="pro-input">
            <input type="password" id="password" placeholder="Contraseña" class="pro-input">
            <button onclick="login()" class="btn-success" style="width:100%; margin-top:10px;">Entrar</button>
            <button onclick="register()" class="btn-link">Crear cuenta nueva</button>
        </div>
    </div>

    <div id="main-app" class="app-container" style="display:none">
        <header class="app-header">
            <button onclick="logout()" class="btn-logout-mini">Salir</button>
            <h1 style="font-size: 1.2rem; margin-top: 15px; opacity: 0.8;">Mis Registros</h1>
        </header>

        <h2 id="current-month-name" class="periodo-titulo">Cargando...</h2>

        <section class="monthly-dashboard">
            <div class="stat-card"><span class="stat-label">Pedidos</span><span id="month-orders-count" class="stat-value">0</span></div>
            <div class="stat-card"><span class="stat-label">Neto</span><span id="month-neto-value" class="stat-value">$0</span></div>
            <div class="stat-card highlight"><span class="stat-label">Líquido</span><span id="month-liquido-value" class="stat-value">$0</span></div>
        </section>

        <section class="input-card-pro">
            <div class="pro-input-group">
                <div class="field">
                    <label>Fecha del pedido</label>
                    <input type="date" id="date-input">
                </div>
                <div class="field">
                    <label>Cantidad SKU</label>
                    <input type="number" id="sku-input" placeholder="0">
                </div>
            </div>
            <button id="add-button" class="btn-save">Registrar Pedido</button>
        </section>

        <main id="tables-container"></main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
